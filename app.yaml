runtime: php83

automatic_scaling:
  max_instances: 5

handlers:
- url: /
  static_files: index.html
  upload: index.html
  secure: always

- url: /(.+\.(html|js|css|ico))$
  static_files: \1
  upload: (.+\.(html|js|css|ico))$
  secure: always

- url: /(.+)
  static_files: \1.html
  upload: (.+)\.html
  secure: always


