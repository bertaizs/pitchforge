<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>chargen</title>
    <link rel="stylesheet" href="${style}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="${pitchforge}/utils.js"></script>
    <script src="${pitchforge}/options.js"></script>

    <script src="${pitchforge}/mini.js"></script>
    <script src="${pitchforge}/Info.js"></script>
    <script src="${pitchforge}/Test.js"></script>
    <script src="${pitchforge}/rules.js"></script>
    <script src="${pitchforge}/Entity.js"></script>
    <script src="${pitchforge}/Path.js"></script>
    <script src="${pitchforge}/Clue.js"></script>
    <script src="${pitchforge}/Verb.js"></script>
    <script src="${pitchforge}/Choice.js"></script>
    <script src="${pitchforge}/Cmd.js"></script>
    <script src="${pitchforge}/game.js"></script>

    <script src="${pitchforge}/ui.js"></script>

  </head>
  <body>

      <table style="width=100%;">
          <tr><td>    
              <!-- game title & top menu -->
              <div id="title">title</div>             <div id="menu">menu</div>            
          </td></tr>
          <tr><td>
              <!-- main contains location description, work contains event queue  -->
              <div id="main">location description appears here</div>
          </td></tr>
          <tr><td>
              <div id="work">events in the event queue unfold here</div>
          </td></tr>
          <tr><td>
              <div id="entity_choices"><!-- choices appear here for the entity you click --></div>
          </td></tr>
          <tr><td>
              <div id="explanation" onclick="ui.hide_explanation()"></div>
          </td></tr>
          <tr><td>
              <div id="player_info" ></div>
              <div id="inventory" ></div>
          </td></tr>
      </table>
  
      <div id="debug" ></div>

  </body>
<!-- the below points to the file defining the game; everything else can be standard -->

    ${game_include}

    <script src="${pitchforge}/init.js"></script>
  
  <script>
    game.run()    // starts main loop, returns when player is in control
    ui.refresh()  // once player is in control, refresh the screen
  </script>
</html>
